# Serves the built SPA and proxies everything Django needs to own -- the
# API, the allauth/Authelia OIDC callback, static/admin assets -- to the
# `web` container over the internal docker network. Client-side routes
# (React Router) fall through to index.html via try_files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long timeout: some API responses stream large video files.
        proxy_read_timeout 600s;
    }

    location /admin/ {
        proxy_pass http://web:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /accounts/ {
        proxy_pass http://web:8000/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://web:8000/static/;
    }

    location / {
        try_files $uri /index.html;
    }
}
