# Serves the built SPA and proxies everything Django needs to own -- the
# API, the allauth/Authelia OIDC callback, static/admin assets -- to the
# `sceneclip_web` container over the internal docker network. Client-side
# routes (React Router) fall through to index.html via try_files.
#
# Deliberately proxies to the container_name (sceneclip_web), not the bare
# compose service name ("web"): this host runs several unrelated projects
# on the shared external traefik_proxy network, and Compose registers the
# service name as a network alias too -- "web" collided with another
# project's own "web" service, and Docker's embedded DNS round-robins
# across every container sharing an alias. About half of all requests were
# silently landing on the wrong app. container_name is globally unique per
# Docker daemon, so this class of collision can't happen with it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    # A literal `proxy_pass http://sceneclip_web:8000/...` resolves the
    # hostname once when this worker process starts and caches that IP for
    # its whole lifetime -- when `web` gets recreated (any deploy that
    # rebuilds/restarts it) without `frontend` also restarting, every
    # request keeps going to the now-dead old IP (502 "connection
    # refused"), invisibly, until someone notices and restarts this
    # container by hand. Hit this for real in production. Docker's
    # embedded DNS (127.0.0.11) always has the current IP; putting the
    # upstream in a variable forces nginx to actually ask it on each
    # request (respecting the `valid` TTL below) instead of resolving once
    # and caching forever -- variables also disable proxy_pass's location-
    # prefix rewriting, but every location here maps onto the identical
    # upstream prefix anyway, so passing the original request URI through
    # unmodified is already the same result.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $web_upstream http://sceneclip_web:8000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long timeout: some API responses stream large video files.
        proxy_read_timeout 600s;
    }

    location /admin/ {
        set $web_upstream http://sceneclip_web:8000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /accounts/ {
        set $web_upstream http://sceneclip_web:8000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        set $web_upstream http://sceneclip_web:8000;
        proxy_pass $web_upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}
