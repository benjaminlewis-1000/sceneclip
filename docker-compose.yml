# SceneClip: web (Django/DRF, gunicorn) + worker (Celery, runs PySceneDetect
# and ffmpeg jobs) + redis (broker) + postgres + frontend (nginx serving the
# built React app, proxying API/auth back to `web`).
#
# All containers join the external `traefik_proxy` docker network purely so
# Cloudflare Tunnel (running elsewhere, see docker_via_tunnels/cloudflared)
# can resolve the `frontend` container by name -- no Traefik/nginx-proxy
# auth layer is used here; Django's own Authelia-OIDC login is the sole gate.
services:
  web:
    build:
      context: ./backend
    container_name: sceneclip_web
    # Without this, the container runs as root -- every file it writes to
    # the bind mounts below (thumbnails, preview clips, encoded scenes,
    # collectstatic output) comes out root-owned on the host instead of
    # owned by whoever's actually supposed to have access to them.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: bash /code/startup.sh
    env_file: .env
    environment:
      - TZ=America/New_York
    volumes:
      - ./backend:/code
      - ${VIDEO_ROOT}:/videos:ro
      # Layered, more-specific rw mount inside the otherwise-read-only
      # VIDEO_ROOT bind -- the only part of the source tree the app is
      # allowed to write to (unverified scene encodes; see
      # config/settings.py:TEMP_SCENE_CLIPS_DIR). Needed here so `web` can
      # stream a not-yet-verified clip and perform the verify-time move
      # into OUTPUT_ROOT.
      - ${VIDEO_ROOT}/_temp_scene_clips:/videos/_temp_scene_clips
      - ${OUTPUT_ROOT}:/output
      - ${APPDATA_ROOT}/media:/media
      - ${APPDATA_ROOT}/previews:/previews
      - ${APPDATA_ROOT}/staticfiles:/code/staticfiles
      - ${APPDATA_ROOT}/logs:/var/log/sceneclip
    depends_on:
      - db
      - redis
    ports:
      # Direct host access for debugging; the public hostname points at
      # `frontend`, not this port.
      - "44490:8000"
    networks:
      - traefik_proxy

  # Two dedicated workers, one per queue (see CELERY_TASK_ROUTES in
  # config/settings.py), so a big scene-detection backlog can't starve
  # scene encoding, or vice versa -- each queue always has its own worker
  # slots regardless of how backed up the other one is.
  worker:
    build:
      context: ./backend
    container_name: sceneclip_worker
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # Also consumes the default "celery" queue (metadata backfill, the
    # orphaned-work sweep task) and is the only one of the two running -B
    # (embedded beat for the periodic sweep) -- running it on both would
    # fire the sweep twice on every schedule tick.
    command: celery -A config worker -l INFO -c 2 -Q detection,celery -B --hostname=detect@%h
    env_file: .env
    environment:
      - TZ=America/New_York
    volumes:
      - ./backend:/code
      - ${VIDEO_ROOT}:/videos:ro
      - ${OUTPUT_ROOT}:/output
      - ${APPDATA_ROOT}/media:/media
      - ${APPDATA_ROOT}/previews:/previews
      - ${APPDATA_ROOT}/logs:/var/log/sceneclip
    depends_on:
      - db
      - redis
    networks:
      - traefik_proxy

  worker_encode:
    build:
      context: ./backend
    container_name: sceneclip_worker_encode
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: celery -A config worker -l INFO -c 2 -Q encoding --hostname=encode@%h
    env_file: .env
    environment:
      - TZ=America/New_York
    volumes:
      - ./backend:/code
      - ${VIDEO_ROOT}:/videos:ro
      # See the same mount on `web` -- this is the container that actually
      # writes the initial (unverified) encode.
      - ${VIDEO_ROOT}/_temp_scene_clips:/videos/_temp_scene_clips
      - ${OUTPUT_ROOT}:/output
      - ${APPDATA_ROOT}/media:/media
      - ${APPDATA_ROOT}/previews:/previews
      - ${APPDATA_ROOT}/logs:/var/log/sceneclip
    depends_on:
      - db
      - redis
    networks:
      - traefik_proxy

  db:
    image: postgres:16-alpine
    container_name: sceneclip_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${APPDATA_ROOT}/db:/var/lib/postgresql/data
    networks:
      - traefik_proxy

  redis:
    image: redis:7-alpine
    container_name: sceneclip_redis
    networks:
      - traefik_proxy

  frontend:
    build:
      context: ./frontend
    container_name: sceneclip_frontend
    depends_on:
      - web
    ports:
      - "44491:80"
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
