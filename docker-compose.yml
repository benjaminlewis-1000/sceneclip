# SceneClip: web (Django/DRF, gunicorn) + worker (Celery, runs PySceneDetect
# and ffmpeg jobs) + redis (broker) + postgres + frontend (nginx serving the
# built React app, proxying API/auth back to `web`).
#
# All containers join the external `traefik_proxy` docker network purely so
# Cloudflare Tunnel (running elsewhere, see docker_via_tunnels/cloudflared)
# can resolve the `frontend_sceneclip` container by name -- no Traefik/
# nginx-proxy auth layer is used here; Django's own Authelia-OIDC login is
# the sole gate.
services:
  web:
    build:
      context: ./backend
    container_name: sceneclip_web
    command: bash /code/startup.sh
    env_file: .env
    environment:
      - TZ=America/New_York
    volumes:
      - ./backend:/code
      - ${VIDEO_ROOT}:/videos:ro
      - ${OUTPUT_ROOT}:/output
      - ${APPDATA_ROOT}/media:/media
      - ${APPDATA_ROOT}/previews:/previews
      - ${APPDATA_ROOT}/staticfiles:/code/staticfiles
      - ${APPDATA_ROOT}/logs:/var/log/sceneclip
    depends_on:
      - db
      - redis
    ports:
      # Direct host access for debugging; the public hostname points at
      # `frontend_sceneclip`, not this port.
      - "44490:8000"
    networks:
      - traefik_proxy

  worker:
    build:
      context: ./backend
    container_name: sceneclip_worker
    command: celery -A config worker -l INFO -c 2
    env_file: .env
    environment:
      - TZ=America/New_York
    volumes:
      - ./backend:/code
      - ${VIDEO_ROOT}:/videos:ro
      - ${OUTPUT_ROOT}:/output
      - ${APPDATA_ROOT}/media:/media
      - ${APPDATA_ROOT}/previews:/previews
      - ${APPDATA_ROOT}/logs:/var/log/sceneclip
    depends_on:
      - db
      - redis
    networks:
      - traefik_proxy

  db:
    image: postgres:16-alpine
    container_name: sceneclip_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${APPDATA_ROOT}/db:/var/lib/postgresql/data
    networks:
      - traefik_proxy

  redis:
    image: redis:7-alpine
    container_name: sceneclip_redis
    networks:
      - traefik_proxy

  frontend_sceneclip:
    build:
      context: ./frontend
    container_name: sceneclip_frontend
    depends_on:
      - web
    ports:
      - "44491:80"
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
